<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFKbot Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">AFK<span class="accent">bot</span> <span class="version" id="version"></span></h1>

    <div class="status-banner" id="statusBanner">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting to dashboard...</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">Health</div>
        <div class="card-value" id="health">-</div>
      </div>
      <div class="card">
        <div class="card-label">Hunger</div>
        <div class="card-value" id="food">-</div>
      </div>
      <div class="card">
        <div class="card-label">Dimension</div>
        <div class="card-value" id="dimension">-</div>
      </div>
      <div class="card">
        <div class="card-label">Coordinates</div>
        <div class="card-value small" id="position">-</div>
      </div>
      <div class="card">
        <div class="card-label">Activity</div>
        <div class="card-value small" id="activity">-</div>
      </div>
      <div class="card">
        <div class="card-label">Uptime</div>
        <div class="card-value small" id="uptime">-</div>
      </div>
      <div class="card">
        <div class="card-label">Ping</div>
        <div class="card-value" id="ping">-</div>
      </div>
      <div class="card">
        <div class="card-label">Memory</div>
        <div class="card-value small" id="memory">-</div>
      </div>
      <div class="card">
        <div class="card-label">Deaths</div>
        <div class="card-value" id="deaths">-</div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-connect" onclick="callAction('connect')">Connect</button>
      <button class="btn btn-reconnect" onclick="callAction('reconnect')">Reconnect</button>
      <button class="btn btn-disconnect" onclick="callAction('disconnect')">Disconnect</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
